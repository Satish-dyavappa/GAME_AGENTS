[project]
name = "game-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Satish" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.23",
    "openai>=3.58.0",
    "playwright>=1.65.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
game-agents = "game_agents:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
